<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width={{width}}, height={{height}}, initial-scale=1.0">
  <title>{{headline_plain}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    {{css_vars}}

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body, html {
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      background-color: #000;
    }

    .poster-canvas {
      position: relative;
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
    }

    /* Background image layer generated by FLUX.2 DiT */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-image: url('{{bg_data_uri}}');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* Top Arch Dome Typography Container (Safe Zone: y in [0.03, 0.38]) */
    .dome-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 38%;
      padding: 34px 40px 0 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    /* Pre-header kicker / brand tag */
    .pre-header {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 6px;
      text-shadow: var(--text-shadow);
      display: {{pre_header_display}};
    }

    /* Headline with adaptive font sizing and balanced wrapping */
    .headline-wrap {
      width: 100%;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin-bottom: 6px;
      {{wrap_filter_css}}
    }

    .headline-line {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: {{font_size}}px;
      line-height: {{line_height}};
      letter-spacing: {{letter_spacing}}px;
      font-weight: 900;
      text-transform: uppercase;
      text-wrap: balance;
      {{headline_fill_css}}
    }

    /* Subtitle / Slogan */
    .slogan {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 0.8px;
      color: var(--sub-color);
      text-shadow: var(--text-shadow);
      margin-top: 2px;
      margin-bottom: 12px;
      max-width: 82%;
      text-wrap: balance;
      display: {{slogan_display}};
    }

    /* Primary CTA Badge (Pill Capsule) */
    .badge-wrapper {
      display: {{badge_display}};
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 24px;
      border-radius: 9999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      box-shadow: var(--badge-shadow);
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid {{badge_border}};
      position: relative;
      overflow: hidden;
    }

    /* Subtle shimmer highlight inside the badge */
    .badge-pill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    /* Secondary offer condition */
    .offer-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--sub-color);
      letter-spacing: 0.5px;
      margin-top: 5px;
      text-shadow: var(--text-shadow);
      display: {{offer_sub_display}};
    }

    .dates-chip {
      display: {{dates_display}};
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--sub-color);
      letter-spacing: 0.5px;
      text-shadow: var(--text-shadow);
      margin-top: 4px;
    }

    /* Floating Minimalist Footer (Anchored unobtrusively at canvas bottom) */
    .floating-footer {
      position: absolute;
      bottom: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
      max-width: 55%;
    }

    .footer-brand {
      font-family: 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--footer-text);
      text-shadow: var(--text-shadow);
      display: {{brand_display}};
    }

    .footer-address {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.3;
      text-shadow: var(--text-shadow);
      display: {{address_display}};
    }

    .footer-right {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .footer-contact-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .footer-hotline {
      display: {{hotline_display}};
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 9999px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--footer-text);
      text-shadow: var(--text-shadow);
    }

    .footer-website {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.5px;
      display: {{website_display}};
    }

    .footer-qr {
      display: {{qr_display}};
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.40);
      width: 58px;
      box-sizing: border-box;
    }

    .qr-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }

    .qr-label {
      font-size: 8px;
      font-weight: 800;
      color: #000;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1;
    }

    @media (max-height: 600px) {
      .dome-container {
        padding: 16px 24px 0 24px;
        height: 42%;
      }
      .pre-header {
        margin-bottom: 2px;
        font-size: 11px;
      }
      .headline-wrap {
        margin-bottom: 2px;
      }
      .slogan {
        margin-bottom: 6px;
        font-size: 13px;
      }
      .floating-footer {
        bottom: 14px;
        left: 24px;
        right: 24px;
      }
    }

    {{custom_css}}
  </style>
</head>
<body>
  <div class="poster-canvas">
    <div class="bg-layer"></div>

    <div class="dome-container">
      <div class="pre-header">{{pre_header}}</div>
      <div class="headline-wrap">
        {{headline_html}}
      </div>
      <div class="slogan">{{slogan}}</div>
      <div class="badge-wrapper">
        <div class="badge-pill">{{offer_main}}</div>
      </div>
      <div class="offer-sub">{{offer_sub}}</div>
      <div class="dates-chip">{{dates}}</div>
    </div>

    <div class="floating-footer">
      <div class="footer-left">
        <div class="footer-brand">{{brand}}</div>
        <div class="footer-address">{{address}}</div>
      </div>
      <div class="footer-right">
        <div class="footer-contact-col">
          <div class="footer-hotline">{{hotline}}</div>
          <div class="footer-website">{{website_link}}</div>
        </div>
        <div class="footer-qr">
          <img src="{{qr_data_uri}}" alt="QR" class="qr-img">
          <div class="qr-label">QUÉT MÃ</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
