<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width={{width}}, height={{height}}, initial-scale=1.0">
  <title>{{headline_plain}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap&subset=vietnamese" rel="stylesheet">
  <style>
    {{css_vars}}
    {{component_css}}

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body, html {
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
      font-family: 'Montserrat', 'Plus Jakarta Sans', 'Be Vietnam Pro', sans-serif;
      background-color: #000;
    }

    .poster-canvas {
      position: relative;
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
    }

    /* Background image layer */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-image: url('{{bg_data_uri}}');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }


    /* Top Floating Category Tag / Mini Header */
    .top-floating-bar {
      position: absolute;
      top: 3.8%;
      left: 5.5%;
      right: 5.5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .top-badge-tag {
      display: {{pre_header_display}};
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 9999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      color: var(--accent-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .top-right-brand {
      display: {{brand_display}};
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--headline-color);
      text-shadow: var(--text-shadow);
    }

    /* Bottom Platform Typography Deck (Safe Zone: y in [0.60, 0.97]) */
    .bottom-platform-deck {
      position: absolute;
      bottom: 3.2%;
      left: 5.5%;
      right: 5.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    /* Theatrical Title Wrap */
    .title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 6px;
      {{wrap_filter_css}}
    }

    .headline-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
    }

    .headline-line {
      font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif;
      font-size: {{font_size}}px;
      line-height: {{line_height}};
      letter-spacing: {{letter_spacing}}px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      text-wrap: balance;
      {{headline_fill_css}}
    }

    /* Slogan / Subtitle */
    .slogan {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.6px;
      color: var(--sub-color);
      text-shadow: var(--text-shadow);
      margin-top: 4px;
      margin-bottom: 14px;
      max-width: 86%;
      text-wrap: balance;
      display: {{slogan_display}};
    }

    /* Horizontal Action & Specs Deck */
    .action-specs-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-radius: 16px;
      background: var(--footer-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    /* Left Promo Block */
    .promo-block {
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .badge-pill {
      display: {{badge_display}};
      align-items: center;
      justify-content: center;
      padding: 9px 28px;
      border-radius: 9999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      box-shadow: var(--badge-shadow);
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      border: 1px solid {{badge_border}};
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .badge-pill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .offer-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .offer-sub {
      font-size: 17px;
      font-weight: 700;
      color: var(--sub-color);
      letter-spacing: 0.5px;
      text-shadow: var(--text-shadow);
      display: {{offer_sub_display}};
    }

    .dates-text {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--sub-color);
      letter-spacing: 0.5px;
      display: {{dates_display}};
    }

    /* Right Contact & Showroom Block */
    .contact-qr-deck {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .contact-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      text-align: right;
    }

    .hotline-chip {
      display: {{hotline_display}};
      align-items: center;
      gap: 6px;
      padding: 7px 18px;
      border-radius: 9999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--footer-text);
      text-shadow: var(--text-shadow);
      white-space: nowrap;
    }

    .address-text {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--footer-text);
      max-width: 320px;
      line-height: 1.35;
      text-shadow: var(--text-shadow);
      display: {{address_display}};
    }

    .website-text {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--sub-color);
      letter-spacing: 0.5px;
      text-shadow: var(--text-shadow);
      display: {{website_display}};
    }

    .applicable-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--footer-text);
      max-width: 340px;
      line-height: 1.35;
      text-shadow: var(--text-shadow);
      display: {{applicable_display}};
    }

    .platform-qr {
      display: {{qr_display}};
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      width: 82px;
      box-sizing: border-box;
    }

    .platform-qr img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      display: block;
    }

    .platform-qr-label {
      font-size: 9.5px;
      font-weight: 900;
      color: #000;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      line-height: 1;
    }

    @media (max-width: 680px) {
      .bottom-platform-deck {
        left: 4%;
        right: 4%;
        bottom: 2.5%;
      }
      .slogan {
        font-size: 15px;
        margin-bottom: 12px;
      }
      .action-specs-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 11px 16px;
      }
      .promo-block {
        justify-content: space-between;
        width: 100%;
      }
      .badge-pill {
        padding: 6px 18px;
        font-size: 14.5px;
        letter-spacing: 0.8px;
      }
      .contact-qr-deck {
        justify-content: space-between;
        align-items: center;
        width: 100%;
        border-top: 1px solid var(--glass-border);
        padding-top: 8px;
      }
      .contact-block {
        align-items: flex-start;
        text-align: left;
      }
      .address-text, .applicable-text {
        max-width: 100%;
      }
    }

    @media (max-height: 600px) {
      .bottom-platform-deck {
        bottom: 2%;
      }
      .slogan {
        margin-bottom: 6px;
        font-size: 14px;
      }
      .action-specs-bar {
        padding: 8px 16px;
      }
    }

    {{custom_css}}
  </style>
</head>
<body>
  <div class="poster-canvas">
    <div class="bg-layer"></div>

    <!-- Top Floating Ambient Bar -->
    <div class="top-floating-bar">
      <div class="top-badge-tag">{{pre_header}}</div>
      <div class="top-right-brand">{{brand}}</div>
    </div>

    <!-- Bottom Platform Typography Deck -->
    <div class="bottom-platform-deck">
      <div class="title-wrap">
        <div class="headline-wrap">
          {{headline_html}}
        </div>
      </div>
      <div class="slogan">{{slogan}}</div>

      <!-- Specs & Action Deck -->
      <div class="action-specs-bar">
        <div class="promo-block">
          {{category_body_html}}
        </div>

        <div class="contact-qr-deck">
          <div class="contact-block">
            <div class="hotline-chip">{{hotline}}</div>
            <div class="address-text">{{address}}</div>
            <div class="website-text">{{website_link}}</div>
            <div class="applicable-text">{{applicable}}</div>
          </div>
          <div class="platform-qr">
            <img src="{{qr_data_uri}}" alt="QR">
            <div class="platform-qr-label">QUÉT MÃ</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
