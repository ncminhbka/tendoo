<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width={{width}}, height={{height}}, initial-scale=1.0">
  <title>{{headline_plain}}</title>
  <style>
    {{font_face_css}}
    {{css_vars}}

    :root {
      --headline-font: {{headline_font_css}};
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body, html {
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
      font-family: var(--headline-font, 'Be Vietnam Pro', sans-serif);
      background-color: #000;
    }

    .poster-canvas {
      position: relative;
      width: {{width}}px;
      height: {{height}}px;
      overflow: hidden;
    }

    /* Background image layer (diffusion output) */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-image: url('{{bg_data_uri}}');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* 3x3 named-anchor grid -- must match zones.ZONE_GRID_AREA exactly.
       Outer rows/columns are "auto" (hug their content) and only the middle
       row/column absorbs remaining space -- this is what makes a corner cell (e.g. a
       QR code or a short badge) anchor snugly against the actual canvas edge/corner
       instead of floating centered inside a large equal-thirds band. */
    .freeform-grid {
      position: absolute;
      inset: 4%;
      z-index: 10;
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto 1fr auto;
      column-gap: 3%;
      row-gap: 3%;
      pointer-events: none;
    }

    .freeform-zone {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      max-width: 100%;
      {{wrap_filter_css}}
    }

    .freeform-block {
      line-height: 1.2;
      letter-spacing: -0.2px;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    .freeform-role-hero {
      line-height: 1.1;
    }

    .freeform-role-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 9999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      box-shadow: var(--badge-shadow);
      width: fit-content;
    }

    .freeform-qr-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--footer-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      width: fit-content;
    }

    .freeform-qr-img {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background: #FFFFFF;
      padding: 2px;
      display: block;
    }

    .freeform-qr-hint {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      text-transform: uppercase;
    }

    {{custom_css}}
  </style>
</head>
<body>
  <div class="poster-canvas">
    <!-- 1. Background image generated by FLUX.2 DiT -->
    <div class="bg-layer"></div>

    <!-- 2. Freeform 3x3 named-anchor grid -->
    <div class="freeform-grid">
{{zones_html}}
    </div>
  </div>
</body>
</html>
